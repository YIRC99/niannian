plugins { id 'com.android.application' }

android {
    namespace 'dev.niannian.reminder'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.niannian.reminder'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '1.8.0'
    }
    signingConfigs {
        localRelease {
            storeFile rootProject.file('niannian-release.jks')
            storePassword System.getenv('NIANNIAN_KEYSTORE_PASSWORD') ?: 'niannian-local-release'
            keyAlias 'niannian'
            keyPassword System.getenv('NIANNIAN_KEYSTORE_PASSWORD') ?: 'niannian-local-release'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.localRelease
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'androidx.core:core:1.13.1' }
