<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>念念 · 本地管理</title>
<style>
:root{color-scheme:light;--bg:#f7f8f2;--paper:#fffdf7;--ink:#283c32;--muted:#68786d;--line:#dfe5d7;--green:#527a58;--pale:#e8efe0;--red:#b65b55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 system-ui,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 16px;border-radius:8px}button:hover{background:var(--pale)}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--green);border-color:var(--green);color:white}.primary:hover{background:#416448}.danger{color:var(--red)}:focus-visible{outline:3px solid #8fb899;outline-offset:2px}input,select,textarea{width:100%;padding:10px 12px;background:white;border:1px solid #cdd7ca;border-radius:8px;color:var(--ink)}textarea{resize:vertical;min-height:110px}label{display:block;font-weight:600;margin-bottom:6px}small,.muted{color:var(--muted)}h1,h2,h3,p{margin-top:0}h1{font-size:26px;letter-spacing:-.5px;margin-bottom:6px}h2{font-size:21px;margin-bottom:8px}h3{font-size:16px}header{display:flex;justify-content:space-between;align-items:center;padding:24px 36px;border-bottom:1px solid var(--line);background:var(--paper);gap:20px}.brand{font-size:21px;font-weight:750}.brand span{font-weight:400;font-size:13px;color:var(--muted);margin-left:12px}.header-actions{display:flex;align-items:center;gap:12px}.connection{font-size:13px;max-width:45vw;overflow-wrap:anywhere}.shell{max-width:1300px;margin:auto;padding:30px 36px}.connect{max-width:580px;margin:5vh auto;padding:32px;background:var(--paper);border:1px solid var(--line);border-radius:16px}.field{margin:18px 0}.hint{font-size:12px;color:var(--muted)}.stack{display:grid;gap:16px}.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}.tabs{display:flex;border-bottom:1px solid var(--line);gap:8px;margin:22px 0 28px}.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:12px 22px;color:var(--muted)}.tabs button[aria-selected=true]{border-color:var(--green);color:var(--ink);font-weight:700}.toolbar{display:flex;align-items:center;gap:12px;margin:20px 0}.toolbar input{max-width:330px}.toolbar select{max-width:190px}.surface{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}th{font-weight:500;font-size:12px;color:var(--muted);background:#f0f3eb}th,td{padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}td small{display:block;font-size:11px;overflow-wrap:anywhere}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:5px 10px;font-size:12px;white-space:nowrap}.tag{display:inline-block;padding:2px 8px;border-radius:5px;background:var(--pale);white-space:nowrap;font-size:12px}.tag.off{color:var(--muted);background:#eff0eb}.empty{text-align:center;padding:55px 20px;color:var(--muted)}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.notice{margin:16px 0;padding:12px 16px;border-left:3px solid var(--green);background:var(--pale);white-space:pre-wrap;overflow-wrap:anywhere}.notice.error{border-color:var(--red);background:#faeeea;color:#8e3e3a}.split{display:grid;grid-template-columns:minmax(260px,350px) 1fr;gap:24px}.panel{padding:24px}.release{padding:20px 24px;border-bottom:1px solid var(--line)}.release:last-child{border-bottom:0}.release p{white-space:pre-wrap;margin:10px 0}.release .row{justify-content:space-between}.number{font-variant-numeric:tabular-nums}.notes{max-width:460px;white-space:pre-wrap;overflow-wrap:anywhere}dialog{border:1px solid var(--line);border-radius:16px;background:var(--paper);color:var(--ink);padding:0;max-width:680px;width:calc(100% - 32px);max-height:90vh}dialog::backdrop{background:#18322566}.dialog-body{padding:28px;overflow:auto;max-height:72vh}.dialog-foot{padding:16px 28px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}details{margin-top:18px}summary{cursor:pointer;color:var(--green)}pre{white-space:pre-wrap;overflow-wrap:anywhere}progress{width:100%;accent-color:var(--green)}[hidden]{display:none!important}.busy{pointer-events:none;opacity:.65}footer{font-size:12px;color:var(--muted);margin-top:32px}.modal-error{margin:0 28px 12px;color:var(--red);white-space:pre-wrap}.rule-json{font:12px/1.6 ui-monospace,Consolas,monospace;min-height:210px}@media(max-width:800px){header{padding:18px}.shell{padding:20px 16px}.brand span{display:block;margin:0}.split{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.toolbar input{max-width:none}.tabs button{padding:12px 15px}.grid2{grid-template-columns:1fr}.connect{margin:2vh auto;padding:24px}.connection{font-size:11px}.dialog-body{padding:20px}th,td{padding:12px}.header-actions{gap:8px}}
</style>
</head>
<body>
<header><div class="brand">念念<span>本地管理</span></div><div class="header-actions"><span id="connection" class="connection muted">尚未连接</span><button id="disconnect" hidden>断开连接</button></div></header>
<main class="shell">
<section id="login" class="connect"><h1>照看念念的小花园</h1><p class="muted">连接你的后端，管理账号、任务与版本。</p><form id="connectForm"><div class="field"><label for="server">后端地址</label><input id="server" type="url" required placeholder="https://你的域名 或 http://IP:56507" autocomplete="url"><div class="hint">填写后端根地址，不需要加 /admin。</div></div><div class="field"><label for="key">管理密钥</label><input id="key" type="password" required minlength="32" autocomplete="off" placeholder="与后端 admin_key 一致"><div class="hint">密钥仅在本页内存中使用，关闭页面后清除。</div></div><button class="primary" type="submit">连接管理端</button></form><p class="hint" style="margin-top:20px;margin-bottom:0">本文件无需部署。首次使用前，在后端配置至少 32 位的 admin_key 并重启后端。</p></section>
<div id="message" class="notice" role="status" aria-live="polite" hidden></div>
<section id="workspace" hidden><div class="tabs" role="tablist" aria-label="管理模块"><button role="tab" data-tab="users" aria-selected="true">账号</button><button role="tab" data-tab="tasks" aria-selected="false">任务</button><button role="tab" data-tab="logs" aria-selected="false">日志</button><button role="tab" data-tab="releases" aria-selected="false">版本发布</button></div><section id="content" aria-live="polite"></section><div id="pagination" class="pager" hidden><span id="count" class="muted"></span><div class="row"><button id="prev">上一页</button><button id="next">下一页</button></div></div><footer>管理操作会留存日志。删除任务会归档并保留历史；删除账号会清除该账号的全部数据。</footer></section>
</main>
<dialog id="dialog"><form id="editForm"><div class="dialog-body"><h2 id="dialogTitle"></h2><div id="dialogFields"></div></div><p id="dialogError" class="modal-error" role="alert"></p><div class="dialog-foot"><button type="button" id="cancelDialog">取消</button><button class="primary" type="submit" id="saveDialog">保存</button></div></form></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let base='',secret='',tab='users',offset=0,total=0,query='',userFilter='',generation=0,sequence=0,items=[],modalSave=null,modalBusy=false,upload=null;
const limit=30, titles={users:['账号','查看账号信息，或帮助用户调整账号。'],tasks:['任务','按账号查找，查看安排并维护任务。'],logs:['日志','查看提醒执行状态与管理操作记录。'],releases:['版本发布','上传正式 APK，客户端会在打开时检查新版本。']};
try{$('server').value=localStorage.getItem('niannian-admin-server')||''}catch{}
function notify(text,error=false){$('message').textContent=text;$('message').className='notice'+(error?' error':'');$('message').hidden=!text}
function normalize(raw){const u=new URL(raw.trim());if(!['http:','https:'].includes(u.protocol)||u.username||u.password||u.search||u.hash||!['','/'].includes(u.pathname))throw Error('请填写后端根地址，例如 https://example.com，不带路径和参数');return u.origin}
async function api(path,{method='GET',body}={}){const g=generation,b=base,k=secret;const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),90000);try{const response=await fetch(b+'/admin'+path,{method,headers:{Authorization:'Bearer '+k,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,credentials:'omit',redirect:'error',signal:ctl.signal});if(g!==generation)throw Error('连接已更换，请重新操作');let data;try{data=await response.json()}catch{throw Error('后端返回格式不正确，请确认地址及后端版本')}if(!response.ok)throw Error(data.error||'请求失败（'+response.status+'）');return data}catch(e){if(e.name==='AbortError')throw Error('请求超时。写入结果可能已保存，请刷新后确认。');if(e instanceof TypeError)throw Error('连接失败，请检查后端地址、网络或浏览器的本地网络访问许可。');throw e}finally{clearTimeout(timer)}}
function date(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleString('zh-CN',{hour12:false})}
function bytes(n){return (Number(n)/1048576).toFixed(1)+' MB'}
function status(v){return ({pending:'待执行',upcoming:'未开始',done:'已完成',paused:'已暂停',expired:'已到期',sent:'已发送',failed:'失败',cancelled:'已取消',scheduled:'已排程',sending:'发送中',delivered:'已执行',accepted:'已接受'})[v]||v}
function field(id,label,value='',type='text',extra=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function openDialog(title,html,save,button='保存'){modalSave=save;modalBusy=false;$('dialogTitle').textContent=title;$('dialogFields').innerHTML=html;$('dialogError').textContent='';$('saveDialog').textContent=button;$('saveDialog').hidden=!save;$('cancelDialog').textContent=save?'取消':'关闭';$('dialog').showModal()}
$('cancelDialog').onclick=()=>{if(!modalBusy)$('dialog').close()};$('dialog').addEventListener('cancel',e=>{if(modalBusy)e.preventDefault()});
$('editForm').onsubmit=async e=>{e.preventDefault();if(modalBusy||!modalSave)return;modalBusy=true;$('saveDialog').disabled=true;$('cancelDialog').disabled=true;try{await modalSave();$('dialog').close();notify('已保存');await load()}catch(e){$('dialogError').textContent=e.message}finally{modalBusy=false;$('saveDialog').disabled=false;$('cancelDialog').disabled=false}};
$('connectForm').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;notify('正在连接…');try{base=normalize($('server').value);secret=$('key').value;generation++;await api('/users?limit=1');try{localStorage.setItem('niannian-admin-server',base)}catch{}$('key').value='';$('login').hidden=true;$('workspace').hidden=false;$('disconnect').hidden=false;$('connection').textContent=base;notify('');offset=0;await load()}catch(e){secret='';notify(e.message,true)}finally{button.disabled=false}};
$('disconnect').onclick=()=>{if(modalBusy)return;if(upload&&!confirm('版本正在上传，断开会中止传输。继续？'))return;if(upload)upload.abort();generation++;sequence++;base='';secret='';items=[];$('content').replaceChildren();$('dialog').close();$('workspace').hidden=true;$('login').hidden=false;$('disconnect').hidden=true;$('connection').textContent='尚未连接';notify('')};
document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{tab=button.dataset.tab;offset=0;query='';userFilter='';load()});
$('prev').onclick=()=>{offset=Math.max(0,offset-limit);load()};$('next').onclick=()=>{offset+=limit;load()};
function heading(){const [title,sub]=titles[tab];return `<h1>${title}</h1><p class="muted">${sub}</p>`}
async function load(){if(!secret)return;const request=++sequence,g=generation,current=tab;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));$('pagination').hidden=true;$('content').innerHTML=heading()+'<div class="surface empty">正在读取…</div>';try{const q=new URLSearchParams({limit,offset,q:query,user_id:userFilter});if(tab==='logs'&&query)q.set('kind',query);const data=await api('/'+tab+'?'+q);if(request!==sequence||g!==generation||current!==tab)return;items=data[tab]||[];total=data.total||0;render();$('pagination').hidden=false;$('count').textContent=total?`共 ${total} 条 · 当前 ${offset+1}–${Math.min(offset+limit,total)} 条`:'暂无记录';$('prev').disabled=offset===0;$('next').disabled=offset+limit>=total}catch(e){if(request!==sequence||g!==generation)return;$('content').innerHTML=heading()+'<div class="surface empty">读取失败，请检查连接后重试。<p><button id="retry">重新读取</button></p></div>';$('retry').onclick=load;notify(e.message,true)}}
function toolbar(){return `<form id="searchForm" class="toolbar">${tab==='logs'?`<select id="search" aria-label="日志类型"><option value="">全部日志</option><option value="admin" ${query==='admin'?'selected':''}>管理操作</option><option value="reminder" ${query==='reminder'?'selected':''}>提醒执行</option></select>`:`<input id="search" value="${esc(query)}" aria-label="搜索" placeholder="${tab==='users'?'搜索邮箱或账号 ID':'搜索任务名称或 ID'}">`}${tab!=='users'?`<input id="userFilter" value="${esc(userFilter)}" aria-label="账号 ID" placeholder="按账号 ID 筛选（可选）">`:''}<button>查询</button><button type="button" id="refresh">刷新</button><span class="grow"></span>${tab!=='logs'?`<button type="button" class="primary" id="create">新建${tab==='users'?'账号':'任务'}</button>`:''}</form>`}
function table(headers,rows,empty){return `<div class="surface table-wrap"><table><thead><tr>${headers.map(h=>'<th>'+h+'</th>').join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`}
function action(text,fn,cls=''){const b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=fn;return b}
function render(){let html=heading();if(tab!=='releases')html+=toolbar();
 if(tab==='users')html+=table(['账号','创建时间','任务 / 密码','操作'],items.map((u,i)=>`<tr><td><strong>${esc(u.email)}</strong><small>${esc(u.id)}</small></td><td class="number">${esc(date(u.created_at))}</td><td>${u.task_count} 个有效任务<small>${u.password_set?'已设密码':'未设密码'}</small></td><td><div class="actions" id="actions-${i}"></div></td></tr>`).join(''),'暂无账号。可新建账号，或调整搜索条件。');
 if(tab==='tasks')html+=table(['任务','所属账号','状态与安排','操作'],items.map((t,i)=>`<tr><td><strong>${esc(t.title)}</strong><small>${esc(t.id)}</small></td><td>${esc(t.email)}</td><td><span class="tag ${t.archived?'off':''}">${t.archived?'已归档':esc(status(t.status))}</span><small>${esc(t.summary)}</small><small>下次：${esc(date(t.next_reminder))}</small></td><td><div class="actions" id="actions-${i}"></div></td></tr>`).join(''),'暂无匹配的任务。可切换账号或新建任务。');
 if(tab==='logs')html+=table(['时间','类型','内容','结果'],items.map(l=>`<tr><td class="number">${esc(date(l.time))}</td><td>${l.kind==='admin'?'管理操作':'提醒执行'}</td><td class="notes">${esc(l.detail)}<small>${esc(l.user_id)}</small></td><td>${esc(status(l.status))}<small class="danger">${esc(l.error)}</small></td></tr>`).join(''),'暂无日志。真实提醒执行和管理修改后会显示在这里。');
 if(tab==='releases')html+=`<div class="split"><form id="uploadForm" class="surface panel"><h2>发布新版本</h2><p class="muted">选择使用原签名构建的正式安装包。版本名称和版本号会自动识别。</p><div class="field"><label for="apk">Android 安装包</label><input id="apk" type="file" accept=".apk" required><small>最大 200 MB。上传成功即发布。</small></div><div class="field"><label for="notes">更新说明</label><textarea id="notes" maxlength="4000" placeholder="这次更新了什么？用户会在更新弹窗里看到。"></textarea></div><button class="primary" type="submit" ${upload?'disabled':''}>上传并发布</button><div id="uploadProgress" class="field" ${upload?'':'hidden'}><progress id="progress" max="100" value="0"></progress><small id="progressText">正在上传…</small></div><p class="hint" style="margin-top:18px">客户端按 versionCode 判断新旧。上传前请提高版本号；下架后不再提示或提供下载。已有更高版本的用户不会降级。</p></form><div><div class="row"><h2 class="grow">版本记录</h2><button id="refresh">刷新</button></div><div class="surface">${items.map((v,i)=>`<article class="release"><div class="row"><strong>v${esc(v.version_name)} <small> / ${v.version_code}</small></strong><span class="tag ${v.published?'':'off'}">${v.published?'已发布':'已下架'}</span></div><p>${esc(v.notes||'未填写更新说明')}</p><small>${esc(date(v.created_at))} · ${bytes(v.size)}</small><div class="actions" id="actions-${i}" style="margin-top:12px"></div><details><summary>文件校验信息</summary><small>SHA-256</small><pre>${esc(v.sha256)}</pre></details></article>`).join('')||'<div class="empty">还没有发布版本。<br>上传第一个 APK 后，客户端即可检查更新。</div>'}</div></div></div>`;
 $('content').innerHTML=html;
 if($('refresh'))$('refresh').onclick=()=>{notify('');load()};
 if($('searchForm'))$('searchForm').onsubmit=e=>{e.preventDefault();query=$('search').value.trim();userFilter=$('userFilter')?.value.trim()||'';offset=0;notify('');load()};
 if($('create'))$('create').onclick=()=>tab==='users'?editUser():editTask();
 items.forEach((item,i)=>{const box=$('actions-'+i);if(!box)return;
  if(tab==='users'){box.append(action('查看',()=>showUser(item)),action('任务',()=>{userFilter=item.id;query='';tab='tasks';offset=0;load()}),action('编辑',()=>editUser(item)),action('删除',()=>deleteUser(item),'danger'))}
  if(tab==='tasks'){box.append(action('详情',()=>showTask(item)));if(!item.archived)box.append(action('编辑',()=>editTask(item)),action(item.paused?'恢复':'暂停',()=>mutate('/tasks/'+item.id+'/paused','PUT',{paused:!item.paused})),action('归档',()=>{if(confirm('归档“'+item.title+'”？将停止后续提醒，保留历史和花园。'))mutate('/tasks/'+item.id,'DELETE')},'danger'))}
  if(tab==='releases'){box.append(action(item.published?'下载安装包':'已下架',()=>{if(item.published&&/^\/api\/v1\/updates\/[a-f0-9]{48}\/download$/.test(item.download_path))window.open(base+item.download_path,'_blank','noopener,noreferrer')}),action(item.published?'下架':'重新发布',()=>{if(confirm((item.published?'下架':'重新发布')+' v'+item.version_name+'？'))mutate('/releases/'+item.id,'PUT',{published:!item.published})},item.published?'danger':''))}
 });if($('uploadForm'))$('uploadForm').onsubmit=uploadAPK;
}
async function mutate(path,method,body){const content=$('content');content.classList.add('busy');try{await api(path,{method,body});notify('操作已完成');await load()}catch(e){notify(e.message,true)}finally{content.classList.remove('busy')}}
function showUser(u){openDialog('账号信息',`<p><strong>${esc(u.email)}</strong></p><p>账号 ID：${esc(u.id)}</p><p>注册时间：${esc(date(u.created_at))}</p><p>有效任务：${u.task_count} · ${u.password_set?'已设置密码':'未设置密码'}</p>`,null)}
function editUser(u){openDialog(u?'编辑账号':'新建账号',field('email','邮箱',u?.email||'','email','required autocomplete="off"')+field('password',u?'新密码（留空不修改）':'登录密码','','password',`${u?'':'required'} minlength="8" maxlength="128" autocomplete="new-password"`)+`<p class="hint">${u?'修改邮箱或密码会使现有登录失效。':'管理员创建的账号可直接用此密码登录，无需再注册。'}</p>`,()=>api('/users'+(u?'/'+u.id:''),{method:u?'PUT':'POST',body:{email:$('email').value,password:$('password').value}}))}
function deleteUser(u){openDialog('删除账号',`<p>即将永久删除 <strong>${esc(u.email)}</strong> 的账号、任务、记录、照片和花园数据。</p><p>已离线排程的手机提醒需设备重新联网或退出登录后撤销。</p>${field('confirmEmail','输入该邮箱以确认','','email','required autocomplete="off"')}`,async()=>{if($('confirmEmail').value.trim()!==u.email)throw Error('邮箱不一致，尚未删除');await api('/users/'+u.id,{method:'DELETE'});if(offset>0&&items.length===1)offset=Math.max(0,offset-limit)},'永久删除')}
function showTask(t){openDialog('任务详情',`<h3>${esc(t.title)}</h3><p>${esc(t.email)}</p><p class="notes">${esc(t.description||'未填写说明')}</p><p>${esc(t.summary)}</p><p>状态：${t.archived?'已归档':esc(status(t.status))}<br>下次提醒：${esc(date(t.next_reminder))}</p><details><summary>完整规则与跟进安排</summary><pre>${esc(JSON.stringify({rule:t.rule,reminder_strategy:t.reminder_strategy},null,2))}</pre></details>`,null)}
function editTask(t){
 const tomorrow=new Date(Date.now()+86400000),d=[tomorrow.getFullYear(),String(tomorrow.getMonth()+1).padStart(2,'0'),String(tomorrow.getDate()).padStart(2,'0')].join('-');
 const original=t?.rule||{kind:'once',mode:'until_done',timezone:'Asia/Shanghai',times:['09:00'],start_date:d};
 const select=(id,label,values,value)=>`<div class="field"><label for="${id}">${label}</label><select id="${id}">${Object.entries(values).map(([key,text])=>`<option value="${key}" ${key===value?'selected':''}>${text}</option>`).join('')}</select></div>`;
 openDialog(t?'编辑任务':'新建任务',(t?`<p class="muted">${esc(t.email)} · ${esc(t.id)}</p>`:field('owner','所属账号 ID',userFilter,'text','required'))+field('title','任务名称',t?.title||'','text','required maxlength="100"')+`<div class="field"><label for="description">说明</label><textarea id="description" maxlength="4000">${esc(t?.description||'')}</textarea></div><div class="grid2">`+
 select('kind','怎样重复',{once:'只在一天提醒',daily:'每天',weekly:'每周指定星期',monthly_window:'每月一段时间',date_range:'指定日期范围',interval:'每隔几天',ongoing:'每天提醒，做完结束',minute_interval:'每隔几分钟催办'},original.kind)+
 select('mode','什么时候算完成',{until_done:'本期完成一次就停止',every_day:'每天分别完成',notify_once:'本期只通知一次'},original.mode)+`</div><div id="calendarRule"><div class="grid2">`+
 field('startDate','开始日期',original.start_date||'','date')+field('endDate','结束日期（可选）',original.end_date||'','date')+`</div>`+field('times','每天提醒时间',(original.times||[]).join(', '),'text','placeholder="09:00, 18:00"')+`</div><div id="minuteRule"><div class="grid2">`+
 field('firstAt','首次提醒时间',original.first_at||'','text','placeholder="2026-10-09T09:00:00+08:00"')+field('endAt','精确截止（可选）',original.end_at||'','text','placeholder="2026-10-09T18:00:00+08:00"')+field('repeatMinutes','每隔几分钟',original.repeat_minutes||5,'number','min="1" max="10080"')+field('minuteEndDate','结束日期（与精确截止二选一）',original.end_date||'','date')+`</div><p class="hint">时间带时区，例如 +08:00 表示北京时间；编辑时保留原有秒数。</p></div><div id="weekRule">`+
 field('weekdays','每周哪几天',(original.weekdays||[1,2,3,4,5]).join(', '),'text','placeholder="1, 2, 3, 4, 5（1 是周一，7 是周日）"')+`</div><div class="grid2" id="monthRule">`+
 field('monthStart','每月开始日',original.month_start||1,'number','min="1" max="31"')+field('monthEnd','每月结束日',original.month_end||15,'number','min="1" max="31"')+`</div><div id="intervalRule">`+
 field('everyDays','每隔几天',original.every_days||2,'number','min="1"')+`</div><details><summary>更多设置</summary><div class="grid2">`+
 field('timezone','时区',original.timezone||'Asia/Shanghai','text','required')+field('maxReminders','每期最多提醒次数（0 不限制）',original.max_reminders||0,'number','min="0"')+`</div></details><label class="check" style="margin-top:18px"><input id="paused" type="checkbox" ${t?.paused?'checked':''}>暂停提醒</label>`,async()=>{
  const kind=$('kind').value,rule={...original,kind,mode:$('mode').value,timezone:$('timezone').value.trim(),max_reminders:Number($('maxReminders').value)};
  for(const key of ['first_at','end_at','repeat_minutes','times','start_date','end_date','weekdays','month_start','month_end','every_days'])delete rule[key];
  if(kind==='minute_interval'){rule.first_at=$('firstAt').value.trim();rule.repeat_minutes=Number($('repeatMinutes').value);rule.end_at=$('endAt').value.trim();rule.end_date=$('minuteEndDate').value;}
  else{rule.times=$('times').value.split(/[,，\s]+/).filter(Boolean);rule.start_date=$('startDate').value;rule.end_date=$('endDate').value;}
  if(kind==='weekly')rule.weekdays=$('weekdays').value.split(/[,，\s]+/).filter(Boolean).map(Number);
  if(kind==='monthly_window'){rule.month_start=Number($('monthStart').value);rule.month_end=Number($('monthEnd').value);}
  if(kind==='interval')rule.every_days=Number($('everyDays').value);
  await api('/tasks'+(t?'/'+t.id:'?user_id='+encodeURIComponent($('owner').value.trim())),{method:t?'PUT':'POST',body:{title:$('title').value,description:$('description').value,rule,paused:$('paused').checked,flower_type:t?.flower_type||''}});
 });
 const change=()=>{const k=$('kind').value;for(const [id,show] of Object.entries({calendarRule:k!=='minute_interval',minuteRule:k==='minute_interval',weekRule:k==='weekly',monthRule:k==='monthly_window',intervalRule:k==='interval'})){$(id).hidden=!show;$(id).querySelectorAll('input').forEach(input=>input.disabled=!show)}};
 $('kind').onchange=change;change();
}
function uploadAPK(e){e.preventDefault();if(upload)return;const file=$('apk').files[0];if(!file||!file.name.toLowerCase().endsWith('.apk')||file.size>200*1048576){notify('请选择不超过 200 MB 的 APK 文件',true);return}const form=new FormData();form.append('file',file);form.append('notes',$('notes').value);const xhr=new XMLHttpRequest(),g=generation;upload=xhr;e.submitter.disabled=true;$('uploadProgress').hidden=false;notify('正在上传，请不要关闭页面。');xhr.open('POST',base+'/admin/releases');xhr.setRequestHeader('Authorization','Bearer '+secret);xhr.timeout=11*60*1000;xhr.upload.onprogress=e=>{if(e.lengthComputable&&$('progress')){$('progress').value=e.loaded/e.total*100;$('progressText').textContent=e.loaded===e.total?'文件已传输，正在校验和发布…':Math.round(e.loaded/e.total*100)+'%'}};const end=()=>{upload=null;if($('uploadForm'))$('uploadForm').querySelector('button[type=submit]').disabled=false};xhr.onload=()=>{end();if(g!==generation)return;let data;try{data=JSON.parse(xhr.responseText)}catch{notify('后端返回格式异常，请刷新版本记录确认上传结果。',true);return}if(xhr.status>=200&&xhr.status<300){notify('v'+data.version_name+' 已发布，客户端下次检查时会获取此版本。');if(tab==='releases')load()}else notify(data.error||'上传失败，请重试',true)};xhr.onerror=()=>{end();if(g===generation)notify('上传连接失败，请检查网络并刷新版本记录后重试。',true)};xhr.ontimeout=()=>{end();if(g===generation)notify('上传超时，请先刷新版本记录确认结果。',true)};xhr.onabort=end;xhr.send(form)}
window.addEventListener('beforeunload',e=>{if(upload||modalBusy){e.preventDefault();e.returnValue=''}});
