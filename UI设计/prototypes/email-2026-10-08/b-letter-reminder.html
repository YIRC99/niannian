<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-collapse:separate;background:#F1ECE2;"><tr><td style="padding:28px 16px;"><!--[if mso]><table role="presentation" width="560" align="center"><tr><td><![endif]--><table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-collapse:separate;max-width:560px;margin:0 auto;"><tr><td style=""><table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-collapse:separate;background:#FFFCF5;border:1px solid #E7DECE;border-radius:4px;"><tr><td style="padding:30px 30px 24px;border-bottom:1px solid #E8E0D2;"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-collapse:separate;"><tr><td><span style="font-size:22px;font-weight:750;letter-spacing:3px;color:#736047">念念</span></td><td align="right" style="font-size:11px;letter-spacing:2px;color:#897A67;">一封小事来信</td></tr></table></td></tr><tr><td style="padding:26px 30px 10px;"><img src="assets/letter.png" width="145" alt="" style="display:block;width:145px;max-width:100%;height:auto;border:0;margin:0 auto;"></td></tr><tr><td style="padding:0 32px;"><p style="margin:0;font-size:15px;line-height:1.85;font-size:17px;color:#736047;">嗨，见字好。</p><h1 class="headline" style="font-size:29px;line-height:1.55;font-weight:600;margin:16px 0 18px;color:#4E493B;">你想做的那件小事，<br>念念还记得。</h1><p style="margin:0;font-size:15px;line-height:1.85;font-size:20px;font-weight:700;color:#5C684D;">给自己留 20 分钟读书</p></td></tr><tr><td style="padding:22px 32px;"><p style="margin:0;font-size:15px;line-height:1.85;color:#746F62;font-size:16px;line-height:2;">把手机放在一旁，从昨天停下的那一页开始。读几页也很好，慢慢来。</p></td></tr><tr><td style="padding:20px 32px 0;border-top:1px solid #E8E0D2;"><p style="margin:0;font-size:15px;line-height:1.85;color:#5D594D;">做完后，打开「念念」点击完成。</p><p style="margin:0;font-size:15px;line-height:1.85;font-size:13px;color:#82796B;margin-top:6px;">想记下今天的感受，也可以附上文字或照片。</p></td></tr><tr><td style="padding:26px 32px 30px;"><p style="margin:0;font-size:15px;line-height:1.85;font-size:12px;color:#82796B;text-align:right;">陪你把日子过好的</p><p style="margin:0;font-size:15px;line-height:1.85;font-size:21px;color:#736047;text-align:right;margin-top:4px;">念念</p></td></tr></table></td></tr><tr><td style="padding:18px 16px 0;"><p style="margin:0;font-size:15px;line-height:1.85;font-size:11px;color:#82796B;text-align:center;">你在念念中开启了邮件提醒。可在 App 的提醒设置中调整。</p></td></tr></table><!--[if mso]></td></tr></table><![endif]--></td></tr></table>
