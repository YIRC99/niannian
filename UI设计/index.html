<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>念念 · 全套 UI 设计画册</title>
<style>
:root{color-scheme:light;--bg:#fffcf5;--paper:#fffef9;--ink:#173d29;--muted:#69786a;--green:#567e5d;--line:#dfe6d8;--soft:#edf3e7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}
a{color:inherit}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #8baf80;outline-offset:4px}
header{max-width:1320px;margin:auto;padding:52px 28px 24px}header p{color:var(--muted);margin:9px 0}header .eyebrow{letter-spacing:.15em;font-size:12px;color:var(--green)}h1{font-size:clamp(26px,4vw,46px);line-height:1.2;margin:10px 0;font-weight:750}
.tools{position:sticky;top:0;z-index:2;border-block:1px solid var(--line);background:var(--bg)}.tools-inner{max-width:1320px;margin:auto;padding:14px 28px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:7px;flex-wrap:wrap;flex:1}.filters button,.zoom-button,.close-button,.step{border:1px solid var(--line);color:var(--ink);background:var(--paper);min-height:42px;padding:5px 13px;border-radius:30px}.filters button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fffdf7}
.search{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--paper);width:220px;color:var(--ink)}
main{max-width:1320px;margin:auto;padding:22px 28px 70px}#count{color:var(--muted);font-size:13px;margin:0 0 20px}
.sheet{margin:0 0 56px;padding:0 0 32px;border-bottom:1px solid var(--line)}.sheet-heading{display:flex;align-items:baseline;justify-content:space-between;gap:15px;margin-bottom:13px}.sheet h2{font-size:22px;margin:0}.sheet .num{font-size:13px;color:var(--muted);margin-right:12px;font-weight:400}.sheet a.original{font-size:13px;color:var(--muted);white-space:nowrap}.picture{display:block;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:zoom-in;line-height:0}
.picture img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:contain}.captions{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:12px}.captions span{display:block;text-align:center;font-size:14px;color:var(--muted)}.captions b{color:var(--green);margin-right:8px}
footer{border-top:1px solid var(--line);padding:25px 28px;color:var(--muted);text-align:center;font-size:13px}footer a{margin:0 10px}
dialog{border:0;padding:0;width:98vw;max-width:1800px;height:96vh;max-height:none;background:var(--bg);color:var(--ink);border-radius:12px}dialog::backdrop{background:#142d24dd}.viewer-bar{height:64px;padding:8px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}#viewer-title{margin:0 auto 0 0;font-size:16px}.viewer-content{height:calc(100% - 64px);overflow:auto;display:grid;place-items:center;padding:12px}#viewer-image{display:block;max-width:100%;max-height:100%;width:auto;height:auto;cursor:zoom-in}.viewer-content.zoomed{display:block}.viewer-content.zoomed #viewer-image{width:1536px;max-width:none;max-height:none;margin:0 auto;cursor:zoom-out}.close-button{font-size:20px;min-width:42px}.step:disabled{opacity:.35;cursor:default}.empty{padding:80px 0;text-align:center;color:var(--muted)}
@media(max-width:650px){header{padding:32px 18px 20px}.tools-inner,main{padding-left:16px;padding-right:16px}.tools{position:static}.filters{gap:5px}.filters button{font-size:13px;padding:5px 11px}.search{width:100%}.sheet-heading{align-items:flex-start}.sheet h2{font-size:18px}.captions{gap:5px}.captions span{font-size:12px}.viewer-bar{padding:8px}.viewer-bar #viewer-title{font-size:12px}.viewer-bar button{font-size:12px;padding:5px 10px}.sheet{margin-bottom:30px}dialog{width:100vw;height:100dvh;border-radius:0}.picture{overflow:auto}.picture img{min-width:660px}.captions b{display:block;margin:0}.zoom-button{display:none}}
@media(prefers-reduced-motion:no-preference){button,a{transition:background-color .15s ease-out,color .15s ease-out}}
@media print{.tools,footer,.original{display:none}.sheet{break-inside:avoid;page-break-after:always;margin:0;padding:0;border:0}header{padding:12px}main{padding:0}}
</style></head>
<body>
<header><div class="eyebrow">念念 · 晴日小庭院 / 2026.10.04</div><h1>每一个页面，都在这座小庭院里。</h1><p>24 张设计板 · 72 个页面与关键状态。点击图片放大，或按页面名称和编号查找。</p><p>沿用已确认的庭院风格。图中数据仅作示例，系统选择器和相机展示衔接效果。</p></header>
<div class="tools"><div class="tools-inner"><nav class="filters" aria-label="按页面分类"></nav><input class="search" type="search" placeholder="搜索登录、日历或 28…" aria-label="搜索页面名称或编号"></div></div>
<main><p><a href="prototypes/sowing-2026-10-08/index.html">新探索：播种页三套可交互 HTML · 种子面对面 / 轻对话 / 一句话确认 ↗</a></p><p id="count" aria-live="polite"></p><div id="sheets"></div><noscript><p>请开启 JavaScript 查看分组画册，也可以直接打开 images 文件夹中的原图。</p></noscript></main>
<footer>整套图片由内置图片生成工具制作。<a href="README.md">图片索引</a><a href="开发规划.md">开发规划</a><a href="manifest.json">页面清单</a><a href="说明.txt">使用说明</a><span>图片可离线浏览。</span></footer>
<dialog id="viewer" aria-labelledby="viewer-title"><div class="viewer-bar"><h2 id="viewer-title"></h2><button class="step" id="prev" aria-label="上一张">← 上一张</button><button class="step" id="next" aria-label="下一张">下一张 →</button><button class="zoom-button" id="zoom">查看原尺寸</button><button class="close-button" id="close" aria-label="关闭大图">×</button></div><div class="viewer-content"><img id="viewer-image" alt=""></div></dialog>
<script>
const boards=[{"id":"01-account","title":"账号与安全","category":"账号","image":"images/01-account.png","prompt":"prompts/01-account.txt","pages":[{"id":"01","title":"密码登录"},{"id":"02","title":"注册与首次设密"},{"id":"03","title":"重置密码"}]},{"id":"02-connection","title":"欢迎与连接","category":"账号","image":"images/02-connection.png","prompt":"prompts/02-connection.txt","pages":[{"id":"04","title":"未登录欢迎"},{"id":"05","title":"首次连接"},{"id":"06","title":"更换连接失败"}]},{"id":"03-profile","title":"我的与账号操作","category":"我的","image":"images/03-profile.png","prompt":"prompts/03-profile.txt","pages":[{"id":"07","title":"我的"},{"id":"08","title":"导出系统分享"},{"id":"09","title":"退出确认"}]},{"id":"04-sowing","title":"播种流程","category":"播种","image":"images/04-sowing.png","prompt":"prompts/04-sowing.txt","pages":[{"id":"10","title":"播种初始"},{"id":"11","title":"AI安排中"},{"id":"12","title":"提醒草稿"}]},{"id":"05-rules-basic","title":"基础提醒规则","category":"规则","image":"images/05-rules-basic.png","prompt":"prompts/05-rules-basic.txt","pages":[{"id":"13","title":"单次提醒"},{"id":"14","title":"每日提醒"},{"id":"15","title":"每周提醒"}]},{"id":"06-rules-cycle","title":"周期提醒规则","category":"规则","image":"images/06-rules-cycle.png","prompt":"prompts/06-rules-cycle.txt","pages":[{"id":"16","title":"每月窗口"},{"id":"17","title":"日期范围"},{"id":"18","title":"间隔天数"}]},{"id":"07-rules-more","title":"催办与更多设置","category":"规则","image":"images/07-rules-more.png","prompt":"prompts/07-rules-more.txt","pages":[{"id":"19","title":"持续到完成"},{"id":"20","title":"分钟催办"},{"id":"21","title":"编辑与更多设置"}]},{"id":"08-main","title":"今天、花园、日历","category":"主页面","image":"images/08-main.png","prompt":"prompts/08-main.txt","pages":[{"id":"22","title":"今天"},{"id":"23","title":"花园"},{"id":"24","title":"日历"}]},{"id":"09-garden","title":"花园与成长日记","category":"花园","image":"images/09-garden.png","prompt":"prompts/09-garden.txt","pages":[{"id":"25","title":"空花园"},{"id":"26","title":"成长日记展开"},{"id":"27","title":"切换花圃"}]},{"id":"10-task","title":"小事详情","category":"任务","image":"images/10-task.png","prompt":"prompts/10-task.txt","pages":[{"id":"28","title":"待完成详情"},{"id":"29","title":"本期已完成"},{"id":"30","title":"已归档详情"}]},{"id":"11-completion","title":"完成与生长","category":"任务","image":"images/11-completion.png","prompt":"prompts/11-completion.txt","pages":[{"id":"31","title":"完成留念"},{"id":"32","title":"附一张照片"},{"id":"33","title":"首次发芽"}]},{"id":"12-records","title":"记录与照片","category":"记录","image":"images/12-records.png","prompt":"prompts/12-records.txt","pages":[{"id":"34","title":"完成记录"},{"id":"35","title":"邮件提醒记录"},{"id":"36","title":"照片大图"}]},{"id":"13-calendar-states","title":"日历里的不同日子","category":"日历","image":"images/13-calendar-states.png","prompt":"prompts/13-calendar-states.txt","pages":[{"id":"37","title":"未来安排"},{"id":"38","title":"当日无安排"},{"id":"39","title":"记录分页"}]},{"id":"14-dialogs","title":"提醒操作确认","category":"弹窗","image":"images/14-dialogs.png","prompt":"prompts/14-dialogs.txt","pages":[{"id":"40","title":"稍后提醒"},{"id":"41","title":"归档确认"},{"id":"42","title":"离开编辑"}]},{"id":"15-selectors","title":"日期、时间与规则","category":"弹窗","image":"images/15-selectors.png","prompt":"prompts/15-selectors.txt","pages":[{"id":"43","title":"日期选择"},{"id":"44","title":"24小时时间选择"},{"id":"45","title":"重复方式选择"}]},{"id":"16-more-controls","title":"完成模式与照片选择","category":"弹窗","image":"images/16-more-controls.png","prompt":"prompts/16-more-controls.txt","pages":[{"id":"46","title":"完成模式"},{"id":"47","title":"修改移除时间"},{"id":"48","title":"系统单张照片选择"}]},{"id":"17-account-states","title":"账号的关键状态","category":"状态","image":"images/17-account-states.png","prompt":"prompts/17-account-states.txt","pages":[{"id":"49","title":"密码错误"},{"id":"50","title":"验证码重发等待"},{"id":"51","title":"登录过期"}]},{"id":"18-editor-states","title":"安排遇到问题时","category":"状态","image":"images/18-editor-states.png","prompt":"prompts/18-editor-states.txt","pages":[{"id":"52","title":"AI不支持规则"},{"id":"53","title":"表单验证错误"},{"id":"54","title":"AI请求失败"}]},{"id":"19-home-states","title":"还没种下与暂时没连上","category":"状态","image":"images/19-home-states.png","prompt":"prompts/19-home-states.txt","pages":[{"id":"55","title":"首页无任务"},{"id":"56","title":"搜索无结果"},{"id":"57","title":"花园刷新失败"}]},{"id":"20-media-feedback","title":"照片与完成反馈","category":"状态","image":"images/20-media-feedback.png","prompt":"prompts/20-media-feedback.txt","pages":[{"id":"58","title":"系统相机衔接"},{"id":"59","title":"照片读取失败"},{"id":"60","title":"重复完成"}]},{"id":"21-record-states","title":"记录的不同状态","category":"记录","image":"images/21-record-states.png","prompt":"prompts/21-record-states.txt","pages":[{"id":"61","title":"邮件发送失败"},{"id":"62","title":"等待发送"},{"id":"63","title":"无文字照片的完成记录"}]},{"id":"22-task-states","title":"提醒的不同状态","category":"任务","image":"images/22-task-states.png","prompt":"prompts/22-task-states.txt","pages":[{"id":"64","title":"已暂停"},{"id":"65","title":"未开始"},{"id":"66","title":"已过期"}]},{"id":"23-growth-states","title":"成长的每个阶段","category":"花园","image":"images/23-growth-states.png","prompt":"prompts/23-growth-states.txt","pages":[{"id":"67","title":"第三次长叶"},{"id":"68","title":"第七次开花"},{"id":"69","title":"旧服务完成反馈"}]},{"id":"24-loading-states","title":"等待与连接反馈","category":"状态","image":"images/24-loading-states.png","prompt":"prompts/24-loading-states.txt","pages":[{"id":"70","title":"今天首次加载"},{"id":"71","title":"日历保留旧数据"},{"id":"72","title":"连接正常与导出中"}]}];
const categories=["全部",...new Set(boards.map(b=>b.category))];
let category="全部",query="",current=0,visible=boards;
const list=document.querySelector("#sheets"),filters=document.querySelector(".filters"),viewer=document.querySelector("#viewer"),pic=document.querySelector("#viewer-image"),viewContent=document.querySelector(".viewer-content");
function filter(){
 visible=boards.filter(b=>(category==="全部"||b.category===category)&&(!query||[b.id,b.title,...b.pages.flatMap(p=>[p.id,p.title])].join(" ").toLowerCase().includes(query)));
 list.replaceChildren();
 document.querySelector("#count").textContent="显示 "+visible.length+" 张设计板，共 "+visible.length*3+" 个页面与状态";
 if(!visible.length){const p=document.createElement("p");p.className="empty";p.textContent="没有找到对应页面，试试换一个关键词。";list.append(p)}
 visible.forEach(b=>{
 const section=document.createElement("section");section.className="sheet";section.id=b.id;
 const head=document.createElement("div");head.className="sheet-heading";
 const h=document.createElement("h2");const num=document.createElement("span");num.className="num";num.textContent=b.id.slice(0,2);h.append(num,b.title);
 const original=document.createElement("a");original.className="original";original.href=b.image;original.target="_blank";original.rel="noopener";original.textContent="打开原图 ↗";head.append(h,original);
 const link=document.createElement("a");link.className="picture";link.href=b.image;link.setAttribute("aria-label","放大："+b.title);
 const image=document.createElement("img");image.src=b.image;image.alt=b.pages.map(p=>p.id+" "+p.title).join("、");image.loading="lazy";image.width=1536;image.height=1024;link.append(image);
 link.addEventListener("click",e=>{e.preventDefault();current=boards.indexOf(b);show();viewer.showModal()});
 const captions=document.createElement("div");captions.className="captions";
 b.pages.forEach(p=>{const s=document.createElement("span"),n=document.createElement("b");n.textContent=p.id;s.append(n,p.title);captions.append(s)});
 section.append(head,link,captions);list.append(section);
 });
}
categories.forEach(c=>{const b=document.createElement("button");b.textContent=c;b.setAttribute("aria-pressed",c===category);b.onclick=()=>{category=c;filters.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));filter()};filters.append(b)});
document.querySelector(".search").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();filter()});
function show(){const b=boards[current];pic.src=b.image;pic.alt=b.pages.map(p=>p.id+" "+p.title).join("、");document.querySelector("#viewer-title").textContent=b.id.slice(0,2)+" / 24 · "+b.title;document.querySelector("#prev").disabled=current===0;document.querySelector("#next").disabled=current===boards.length-1;viewContent.classList.remove("zoomed");document.querySelector("#zoom").textContent="查看原尺寸";viewContent.scrollTop=0;viewContent.scrollLeft=0}
function step(d){current=Math.max(0,Math.min(boards.length-1,current+d));show()}
document.querySelector("#prev").onclick=()=>step(-1);document.querySelector("#next").onclick=()=>step(1);document.querySelector("#close").onclick=()=>viewer.close();
function zoom(){const z=viewContent.classList.toggle("zoomed");document.querySelector("#zoom").textContent=z?"适应窗口":"查看原尺寸"}document.querySelector("#zoom").onclick=zoom;pic.onclick=zoom;
viewer.addEventListener("click",e=>{if(e.target===viewer)viewer.close()});viewer.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){e.preventDefault();step(-1)}if(e.key==="ArrowRight"){e.preventDefault();step(1)}});
filter();
</script></body></html>
